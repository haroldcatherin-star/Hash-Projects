<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fonsai — image de partage</title>
<!-- Gabarit de public/assets/og.jpg (1200×630), photographié par scripts/captures.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #f4efe6; color: #1e2a22; display: grid; grid-template-columns: 600px 600px; }
  .left { padding: 60px 56px 52px 64px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -.02em; }
  .logo img { width: 58px; height: 58px; border-radius: 15px; }
  h1 { margin-top: 64px; font-size: 76px; line-height: .98; font-weight: 800; letter-spacing: -.045em; }
  h1 span { color: #2a6049; display: block; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.35; color: #3a463e; font-weight: 500; max-width: 470px; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 22px; }
  .btn { background: #1e3a2b; color: #f7f2e8; font-weight: 700; font-size: 22px; padding: 15px 28px; border-radius: 999px; box-shadow: 0 8px 22px rgba(30,58,43,.28); }
  .url { font-size: 22px; font-weight: 600; color: #6b7268; }
  .right { background: url(/assets/island.jpg) center / cover no-repeat; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo"><img src="/favicon.svg" alt="">Fonsai</div>
    <h1>Make focus <span>addictive.</span></h1>
    <p>Chaque minute de concentration fait pousser ton île.</p>
    <div class="foot"><span class="btn">Ouvrir l'app →</span><span class="url">fonsai.app</span></div>
  </div>
  <div class="right"></div>
</body>
</html>
