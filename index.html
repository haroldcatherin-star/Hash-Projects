<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hash Projects</title>
<style>
  :root{
    --bg: #0b0b0a;
    --text: #c9c7bd;
    --text-dim: #6f6d65;
    --line: #232220;
    --card-bg: #121211;
    --invert-bg: #c9c7bd;
    --invert-fg: #0b0b0a;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); min-height:100%; }
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px 100px; }

  /* ---- header ---- */
  header{ padding:64px 20px 40px; text-align:center; border-bottom:1px solid var(--line); }
  .word{
    font-size:clamp(2rem,6vw,3.4rem); font-weight:900; text-transform:uppercase;
    letter-spacing:-0.01em; line-height:1; color:var(--text);
  }
  .secret-trigger{ cursor:default; }
  .tag{
    margin-top:14px; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim);
  }

  /* ---- toolbar ---- */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    padding:28px 0 18px;
  }
  .search{
    flex:1 1 240px; background:transparent; border:1px solid var(--line); border-radius:0;
    padding:12px 14px;
  }
  .search input{
    width:100%; background:transparent; border:none; outline:none; color:var(--text);
    font-size:.82rem; letter-spacing:.04em; text-transform:uppercase;
  }
  .search input::placeholder{ color:var(--text-dim); }
  .count{ font-size:.82rem; color:var(--text-dim); letter-spacing:.04em; min-width:1.2em; text-align:right; }

  /* ---- dropzone ---- */
  .dropzone{
    border:1px dashed var(--line); padding:18px; text-align:center; cursor:pointer;
    transition:border-color .15s, color .15s; margin-bottom:8px;
  }
  .dropzone.drag{ border-color:var(--text-dim); color:var(--text); }
  .dropzone span{
    font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--text-dim);
  }
  .dropzone.drag span{ color:var(--text); }
  input[type=file]{ display:none; }
  .msg{ font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; padding:10px 2px; min-height:1.4em; color:var(--text-dim); }

  /* ---- grid ---- */
  .grid{
    display:grid; grid-template-columns:1fr; gap:1px; background:var(--line);
    border:1px solid var(--line); margin-top:30px;
  }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:940px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:1180px){ .grid{ grid-template-columns:repeat(4,1fr); } }

  .card{
    background:var(--card-bg); padding:20px 18px; display:flex; flex-direction:column;
    gap:8px; min-height:170px; transition:background .12s, color .12s;
  }
  .card:hover{ background:var(--invert-bg); color:var(--invert-fg); }
  .card:hover .card-meta{ color:#4a4944; }
  .card:hover .card-actions{ border-top-color:#9a988e; }

  .card-title, .card-desc{
    cursor:text; outline:none; border-radius:1px;
  }
  .card-title:hover, .card-desc:hover, .card-title:focus, .card-desc:focus{
    text-decoration:underline dotted; text-underline-offset:3px;
  }
  .card-title{
    font-size:.95rem; font-weight:800; text-transform:uppercase; letter-spacing:.01em;
    line-height:1.25; word-break:break-word;
  }
  .card-desc{
    font-size:.78rem; line-height:1.4; color:var(--text-dim); word-break:break-word; min-height:1.3em;
  }
  .card:hover .card-desc{ color:#3f3e39; }
  .card-desc:empty:before{ content: attr(data-placeholder); }

  .card-meta{ font-size:.66rem; letter-spacing:.04em; color:var(--text-dim); transition:color .12s; }

  .card-actions{
    margin-top:auto; display:flex; gap:14px; flex-wrap:wrap; padding-top:10px;
    border-top:1px solid var(--line); transition:border-color .12s;
  }
  .card-actions button{
    background:none; border:none; padding:0; cursor:pointer; font-family:inherit;
    font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:inherit;
    text-decoration:underline; text-underline-offset:3px; opacity:.75;
  }
  .card-actions button:hover{ opacity:1; }

  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim);
    font-size:.75rem; letter-spacing:.08em; text-transform:uppercase;
  }

  footer{
    max-width:1180px; margin:50px auto 0; padding:22px 20px 0; border-top:1px solid var(--line);
    color:var(--text-dim); font-size:.68rem; letter-spacing:.03em; line-height:1.7;
  }

  /* ---- gate + secret overlay (shared) ---- */
  .gate, .overlay{
    position:fixed; inset:0; background:var(--bg); z-index:1000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    padding:20px;
  }
  .overlay{ display:none; }
  .gate-word{
    font-size:clamp(1.6rem,5vw,2.4rem); font-weight:900; text-transform:uppercase;
    letter-spacing:-0.01em; color:var(--text);
  }
  .code-input{
    background:transparent; border:none; border-bottom:1px solid var(--line); outline:none;
    color:var(--text); font-family:inherit; font-size:.85rem; letter-spacing:.3em;
    text-align:center; text-transform:uppercase; padding:10px 4px; width:200px;
  }
  .code-input::placeholder{ color:var(--text-dim); letter-spacing:.3em; }
  .code-input:focus{ border-bottom-color:var(--text-dim); }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-6px); }
    40%,60%{ transform:translateX(6px); }
  }
  .shake{ animation:shake .35s; }

  .overlay-close{
    position:absolute; top:22px; right:26px; background:none; border:none; cursor:pointer;
    color:var(--text-dim); font-size:1.1rem; font-family:inherit; line-height:1;
  }
  .overlay-close:hover{ color:var(--text); }
  .overlay-body{ width:100%; max-width:1180px; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-word">HASH PROJECTS</div>
  <input id="gateInput" class="code-input" type="password" placeholder="[code]" autocomplete="off" autofocus>
</div>

<div id="app" style="display:none;">

<header>
  <div class="word">HA<span id="secretTrigger" class="secret-trigger">S</span>H PROJECTS</div>
  <p class="tag">Personal archive</p>
</header>

<div class="wrap">

  <div class="toolbar">
    <div class="search">
      <input id="searchInput" type="text" placeholder="[z]">
    </div>
    <span class="count" id="count">0</span>
  </div>

  <div class="dropzone" id="dropzone">
    <span>drop</span>
    <input type="file" id="fileInput" accept=".html,.htm" multiple>
  </div>
  <div class="msg" id="msg"></div>

  <div class="grid" id="grid"></div>

</div>

<footer>
  Files are stored locally in this browser — not on a server, not synced elsewhere.
</footer>

</div>

<div id="secretOverlay" class="overlay">
  <button id="secretClose" class="overlay-close">×</button>

  <div id="secretGateWrap">
    <input id="secretInput" class="code-input" type="password" placeholder="[code]" autocomplete="off">
  </div>

  <div id="secretContent" class="overlay-body" style="display:none;">
    <div class="toolbar">
      <div class="search">
        <input id="secretSearchInput" type="text" placeholder="[z]">
      </div>
      <span class="count" id="secretCount">0</span>
    </div>

    <div class="dropzone" id="secretDropzone">
      <span>drop</span>
      <input type="file" id="secretFileInput" accept=".html,.htm" multiple>
    </div>
    <div class="msg" id="secretMsg"></div>

    <div class="grid" id="secretGrid"></div>
  </div>
</div>

<script>
/* ============================================================
   ACCESS — edit these two codes to your own
   ============================================================ */
const ACCESS_CODE = "changeme";  // required to view the site at all
const SECRET_CODE = "shhh";      // required to open the secret compartment

/* ---------- IndexedDB helper ---------- */
const DB_NAME = "hashProjectsDB";
const STORE = "files";

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(record){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ---------- state ---------- */
let files = [];
let query = "";
let secretQuery = "";

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const msgEl = document.getElementById('msg');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const searchInput = document.getElementById('searchInput');

const secretGrid = document.getElementById('secretGrid');
const secretCountEl = document.getElementById('secretCount');
const secretMsgEl = document.getElementById('secretMsg');
const secretDropzone = document.getElementById('secretDropzone');
const secretFileInput = document.getElementById('secretFileInput');
const secretSearchInput = document.getElementById('secretSearchInput');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatSize(bytes){
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function extractTitle(html, fallback){
  try{
    const m = html.match(/<title[^>]*>([^<]*)<\/title>/i);
    if (m && m[1].trim()) return m[1].trim();
  }catch(e){}
  return fallback;
}

function showMsg(el, text){
  el.textContent = text;
  if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 4000);
}

function matchQuery(q){
  return f => !q || (f.title + " " + f.name + " " + (f.description||"")).toLowerCase().includes(q);
}
function byDateDesc(a, b){ return b.date.localeCompare(a.date); }

function cardsHTML(list){
  return list.map(f => `
    <div class="card" data-id="${f.id}">
      <div class="card-title" contenteditable="true" data-field="title">${escapeHtml(f.title)}</div>
      <div class="card-desc" contenteditable="true" data-field="description" data-placeholder="add description...">${escapeHtml(f.description || "")}</div>
      <div class="card-meta">${escapeHtml(f.name)} — ${formatSize(f.size)}</div>
      <div class="card-meta">${escapeHtml(f.date)}</div>
      <div class="card-actions">
        <button data-action="open">Open</button>
        <button data-action="download">Download</button>
        <button data-action="delete">Delete</button>
      </div>
    </div>
  `).join("");
}

function renderInto(gridEl, countEl, list){
  countEl.textContent = list.length;
  gridEl.innerHTML = list.length ? cardsHTML(list) : `<div class="empty">no files yet</div>`;
}

/* ---------- render: main ---------- */
function render(){
  const q = query.trim().toLowerCase();
  const list = files.filter(f => !f.secret).filter(matchQuery(q)).sort(byDateDesc);
  renderInto(grid, countEl, list);
}

/* ---------- render: secret ---------- */
function renderSecret(){
  const q = secretQuery.trim().toLowerCase();
  const list = files.filter(f => f.secret).filter(matchQuery(q)).sort(byDateDesc);
  renderInto(secretGrid, secretCountEl, list);
}

/* ---------- shared card interactions ---------- */
function wireGrid(gridEl, afterChange){
  gridEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const card = e.target.closest('.card');
    const id = card.dataset.id;
    const file = files.find(f => f.id === id);
    if (!file) return;
    const action = btn.dataset.action;

    if (action === 'open'){
      const blob = new Blob([file.content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
    if (action === 'download'){
      const blob = new Blob([file.content], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
    if (action === 'delete'){
      if (!confirm('Delete "' + file.title + '"?')) return;
      await dbDelete(id);
      files = files.filter(f => f.id !== id);
      afterChange();
    }
  });

  gridEl.addEventListener('blur', async (e) => {
    const el = e.target;
    if (!el.matches('[contenteditable]')) return;
    const card = el.closest('.card');
    const id = card.dataset.id;
    const file = files.find(f => f.id === id);
    if (!file) return;
    const field = el.dataset.field;
    let value = el.textContent.trim();

    if (field === 'title' && !value){
      value = file.title;
      el.textContent = value;
    }

    file[field] = value;
    await dbPut(file);
  }, true);

  gridEl.addEventListener('keydown', (e) => {
    if (e.target.matches('[contenteditable]') && e.key === 'Enter'){
      e.preventDefault();
      e.target.blur();
    }
  });
}

wireGrid(grid, render);
wireGrid(secretGrid, renderSecret);

/* ---------- upload ---------- */
async function handleFiles(fileList, secret, msgElement, afterFn){
  const arr = Array.from(fileList);
  let added = 0, rejected = 0;

  for (const f of arr){
    const isHtml = /\.(html?|HTML?)$/.test(f.name);
    if (!isHtml){ rejected++; continue; }
    const content = await f.text();
    const record = {
      id: (crypto.randomUUID ? crypto.randomUUID() : "f" + Date.now() + Math.random().toString(16).slice(2)),
      name: f.name,
      title: extractTitle(content, f.name.replace(/\.(html?|HTML?)$/, '')),
      description: "",
      size: f.size,
      date: new Date().toISOString().slice(0,10),
      content,
      secret: !!secret
    };
    await dbPut(record);
    files.push(record);
    added++;
  }

  afterFn();
  if (rejected && added) showMsg(msgElement, added + " file(s) added, " + rejected + " skipped (not .html)");
  else if (rejected) showMsg(msgElement, rejected + " file(s) skipped — only .html/.htm accepted");
  else if (added) showMsg(msgElement, added + " file(s) added");
}

function wireDropzone(zoneEl, inputEl, secret, msgElement, afterFn){
  zoneEl.addEventListener('click', () => inputEl.click());
  inputEl.addEventListener('change', (e) => { handleFiles(e.target.files, secret, msgElement, afterFn); inputEl.value = ""; });

  ['dragenter','dragover'].forEach(evt => zoneEl.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(evt => zoneEl.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation(); zoneEl.classList.remove('drag');
  }));
  zoneEl.addEventListener('drop', (e) => {
    if (e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files, secret, msgElement, afterFn);
  });
}

wireDropzone(dropzone, fileInput, false, msgEl, render);
wireDropzone(secretDropzone, secretFileInput, true, secretMsgEl, renderSecret);

/* ---------- search ---------- */
searchInput.addEventListener('input', (e) => { query = e.target.value; render(); });
secretSearchInput.addEventListener('input', (e) => { secretQuery = e.target.value; renderSecret(); });

/* ============================================================
   GATE — site-wide access code
   ============================================================ */
const gate = document.getElementById('gate');
const gateInput = document.getElementById('gateInput');
const app = document.getElementById('app');

async function initApp(){
  try{
    files = await dbGetAll();
    files.forEach(f => {
      if (f.description === undefined) f.description = "";
      if (f.secret === undefined) f.secret = false;
    });
  }catch(e){
    files = [];
  }
  render();
}

function unlockSite(){
  gate.style.display = 'none';
  app.style.display = '';
  try{ sessionStorage.setItem('hp_unlocked', '1'); }catch(e){}
  initApp();
}

function wrongCode(inputEl){
  inputEl.value = '';
  inputEl.classList.add('shake');
  setTimeout(() => inputEl.classList.remove('shake'), 350);
}

let alreadyUnlocked = false;
try{ alreadyUnlocked = sessionStorage.getItem('hp_unlocked') === '1'; }catch(e){}

if (alreadyUnlocked){
  unlockSite();
} else {
  gateInput.focus();
}

gateInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (gateInput.value === ACCESS_CODE) unlockSite();
  else wrongCode(gateInput);
});

/* ============================================================
   SECRET COMPARTMENT — triggered by the hidden "S" in the logo
   ============================================================ */
const secretTrigger = document.getElementById('secretTrigger');
const secretOverlay = document.getElementById('secretOverlay');
const secretClose = document.getElementById('secretClose');
const secretGateWrap = document.getElementById('secretGateWrap');
const secretContent = document.getElementById('secretContent');
const secretInput = document.getElementById('secretInput');

function showSecretContent(){
  secretGateWrap.style.display = 'none';
  secretContent.style.display = '';
  renderSecret();
}

secretTrigger.addEventListener('click', () => {
  secretOverlay.style.display = 'flex';
  let secretUnlocked = false;
  try{ secretUnlocked = sessionStorage.getItem('hp_secret_unlocked') === '1'; }catch(e){}
  if (secretUnlocked){
    showSecretContent();
  } else {
    secretGateWrap.style.display = '';
    secretContent.style.display = 'none';
    secretInput.value = '';
    secretInput.focus();
  }
});

secretClose.addEventListener('click', () => { secretOverlay.style.display = 'none'; });

secretInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (secretInput.value === SECRET_CODE){
    try{ sessionStorage.setItem('hp_secret_unlocked', '1'); }catch(err){}
    showSecretContent();
  } else {
    wrongCode(secretInput);
  }
});
</script>

</body>
</html>
